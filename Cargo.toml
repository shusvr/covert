[package]
name = "covert"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
aws-lc-rs = "1.18.2"
base64 = "0.23.1"
bitflags = "2.13.2"
bytes = "1.12.1"
circular-buffer = "2.0.1"
clap = { version = "4", features = ["derive"] }
dashmap = "6.2.1"
etherparse = "0.21.0"
fastrand = "2.5.0"
futures = "0.3.34"
hickory-proto = "0.26.3"
ipnet = { version = "2.12.2", features = ["serde"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
# serde_urlencoded = "0.7.1"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["codec", "net"] }
toml = "1.1.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tun = { package = "tun-rs", version = "2.8.9", features = ["async"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
