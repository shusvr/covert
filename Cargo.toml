[package]
name = "covert"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "covert"
path = "src/bin/covert/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:anyhow", "dep:clap", "dep:dirs", "dep:socket2", "dep:tokio", "dep:rtnetlink", "dep:toml_edit", "dep:tracing-subscriber", "dep:tun"]

[dependencies]
anyhow = { version = "1.0.104", optional = true }
aws-lc-rs = "1.18.2"
base64 = "0.23.1"
bitflags = "2.13.2"
bytes = "1.12.1"
clap = { version = "4", features = ["derive"], optional = true }
dirs = { version = "7.0.0", optional = true }
etherparse = "0.21.0"
fastrand = "2.5.0"
futures = "0.3.34"
ipnet = { version = "2.12.2", features = ["serde"] }
libc = "0.2"
rtnetlink = { version = "0.24.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_qs = "1.1.3"
socket2 = { version = "0.6.5", features = ["all"], optional = true }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"], optional = true }
tokio-util = { version = "0.7.20", features = ["codec"] }
toml_edit = { version = "0.25.19", features = ["serde"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", optional = true }
tun = { package = "tun-rs", version = "2.8.9", features = ["async"], optional = true }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
zeroize = "1.9.1"
